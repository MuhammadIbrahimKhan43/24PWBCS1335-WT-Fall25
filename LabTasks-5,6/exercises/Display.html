<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Display Property </title>
    <link rel="stylesheet" href="../Styles/Display.css">
</head>
<body>

<h1><u>Display Property Showcase</u></h1>

<h2>Block Elements</h2>
<div class="block">Block 1</div>
<div class="block">Block 2</div>

<h2>Inline Elements</h2>
<span class="inline">Inline 1</span>
<span class="inline">Inline 2</span>

<h2>Inline Block Elements</h2>
<div class="inline-block">Box 1</div>
<div class="inline-block">Box 2</div>

<h2>Table Display</h2>

<div class="table">
    <div class="row">
        <div class="cell">Row 1 Column 1</div>
        <div class="cell">Row 1 Column 2</div>
    </div>
    <div class="row">
        <div class="cell">Row 2 Column 1</div>
        <div class="cell">Row 2 Column 2</div>
    </div>
</div>

<h2>Visibility and Display</h2>
<div class="visible">Visible Box</div>
<div class="hidden">Hidden Box</div>
<div class="none">None Box</div>

</body>
</html>
