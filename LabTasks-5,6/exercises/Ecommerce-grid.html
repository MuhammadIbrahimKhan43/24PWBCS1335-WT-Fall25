<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Product Grid</title>
    <link rel="Stylesheet" href="../Styles/Ecommerce-grid.css">
</head>
<body>

<h1>E-commerce Product Grid</h1>

<div class="grid-container">
    <div class="product-card">
        <img src="../Layouts/Product1.jpg" alt="Product 1">
        <h2>Product 1</h2>
        <p>$25</p>
        <button>Add to Cart</button>
    </div>
    <div class="product-card">
        <img src="../Layouts/Product2.jpg" alt="Product 2">
        <h2>Product 2</h2>
        <p>$40</p>
        <button>Add to Cart</button>
    </div>
    <div class="product-card">
        <img src="../Layouts/Product3.jpg" alt="Product 3">
        <h2>Product 3</h2>
        <p>$15</p>
        <button>Add to Cart</button>
    </div>
    <div class="product-card">
        <img src="../Layouts/Product4.jpg" alt="Product 4">
        <h2>Product 4</h2>
        <p>$50</p>
        <button>Add to Cart</button>
    </div>
</div>

</body>
</html>
