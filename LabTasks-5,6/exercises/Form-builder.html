<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Form Builder</title>
    <link rel="stylesheet" href="../Styles/Form-builder.css">
</head>
<body>

<h1>Responsive Form</h1>

<form class="form-container">

    <div class="form-row">
        <div class="form-group">
            <label>First Name</label>
            <input type="text">
        </div>
        <div class="form-group">
            <label>Last Name</label>
            <input type="text">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Email</label>
            <input type="email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group full">
            <label>Address</label>
            <input type="text">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>City</label>
            <input type="text">
        </div>
        <div class="form-group">
            <label>Zip Code</label>
            <input type="number">
        </div>
    </div>

    <button type="submit">Submit</button>

</form>

</body>
</html>
