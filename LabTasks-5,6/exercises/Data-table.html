<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Table</title>
    <link rel="stylesheet" href="../Styles/Data-table.css">
</head>
<body>

<h1>Student Data</h1>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Department</th>
            <th>Grade</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td data-label="Name">Ali</td>
            <td data-label="Age">20</td>
            <td data-label="Department">CS</td>
            <td data-label="Grade">A</td>
        </tr>
        <tr>
            <td data-label="Name">Ahmed</td>
            <td data-label="Age">21</td>
            <td data-label="Department">SE</td>
            <td data-label="Grade">B</td>
        </tr>
        <tr>
            <td data-label="Name">Sara</td>
            <td data-label="Age">22</td>
            <td data-label="Department">IT</td>
            <td data-label="Grade">A+</td>
        </tr>
    </tbody>
</table>

</body>
</html>
