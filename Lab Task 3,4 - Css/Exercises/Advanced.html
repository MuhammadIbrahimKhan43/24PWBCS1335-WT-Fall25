<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Advanced CSS Effects</title>
<link rel="stylesheet" href="../Styles/Advanced.css">
</head>
<body>

<h1>Advanced CSS Effects</h1>

<h2 class="gradient-text">Gradient Text </h2>

<div class="checkbox-container">
  <input type="checkbox" id="check1">
  <label for="check1">Custom Checkbox</label>
</div>

<div class="radio-container">
  <input type="radio" id="radio1" name="radio">
  <label for="radio1">Option 1</label>
  <input type="radio" id="radio2" name="radio">
  <label for="radio2">Option 2</label>
</div>

<div class="loader"></div>

<h2 class="clip-text">Clipped Text Effect</h2>

<div class="shadow-box">Shadow Box</div>

</body>
</html>
